<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة العميل — مدفوعاتي</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .portal-header {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff; padding: 20px 28px; border-radius: 14px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 16px;
    }
    .portal-nav { display:flex; gap:8px; flex-wrap:wrap; }
    .portal-nav a {
      color:#fff; text-decoration:none; padding:8px 18px;
      border-radius:8px; background:rgba(255,255,255,0.15);
      font-size:14px; font-weight:600;
    }
    .portal-nav a:hover, .portal-nav a.active { background:rgba(255,255,255,0.3); }
    .payment-card {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 12px; padding: 20px; margin-bottom: 16px;
    }
    .pay-status { padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
    .pay-pending { background: rgba(255,193,7,0.15); color: #ffc107; }
    .pay-approved { background: rgba(40,167,69,0.15); color: #28a745; }
    .pay-rejected { background: rgba(220,53,69,0.15); color: #dc3545; }
    .pay-under-review { background: rgba(13,110,253,0.15); color: #0d6efd; }
    .upload-zone {
      border: 2px dashed var(--border-color); border-radius: 12px;
      padding: 24px; text-align: center; cursor: pointer; transition: all 0.25s;
    }
    .upload-zone:hover { border-color: var(--color-primary); background: var(--bg-input); }
    .upload-zone.has-file { border-color: var(--color-primary); background: rgba(255,102,0,0.05); }
    .payment-instructions {
      background: var(--bg-input); border-radius: 10px; padding: 16px;
      margin-bottom: 16px; font-size: 14px;
    }
    .payment-instructions strong { color: var(--color-primary); }
  </style>
</head>
<body>

  <div id="portalLoading" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="text-center">
      <div class="spinner-border text-primary"></div>
      <p class="mt-3 text-muted">جاري التحميل...</p>
    </div>
  </div>

  <div id="portalContent" style="display:none; max-width:900px; margin:0 auto; padding:20px;">

    <div class="portal-header">
      <h2 style="margin:0; font-weight:700;"><i class="fas fa-file-invoice-dollar"></i> مدفوعاتي</h2>
      <div class="portal-nav">
        <a href="portal-dashboard.html">لوحتي</a>
        <a href="portal-orders.html">طلباتي</a>
        <a href="portal-payments.html" class="active">مدفوعاتي</a>
        <a href="#" id="portalLogoutBtn"><i class="fas fa-sign-out-alt"></i></a>
      </div>
    </div>

    <!-- رفع دفعة جديدة -->
    <div class="payment-card" id="newPaymentCard" style="display:none;">
      <h5 class="mb-3"><i class="fas fa-upload"></i> رفع إثبات دفع</h5>

      <div id="paymentInstructions" class="payment-instructions">
        <p class="mb-2"><strong>تعليمات الدفع:</strong></p>
        <div id="instructionsBody">جاري تحميل طرق الدفع...</div>
      </div>

      <form id="paymentForm">
        <input type="hidden" id="orderId" />
        <div class="mb-3">
          <label class="form-label">الطلب</label>
          <input type="text" class="form-control" id="orderDisplay" readonly />
        </div>
        <div class="mb-3">
          <label class="form-label">المبلغ المدفوع</label>
          <input type="number" class="form-control" id="amount" step="0.01" min="0.01"
            placeholder="أدخل المبلغ الذي دفعته" required />
          <small class="text-muted" id="amountHint"></small>
        </div>
        <div class="mb-3">
          <label class="form-label">طريقة الدفع</label>
          <select class="form-select" id="method" required>
            <option value="">اختر طريقة الدفع...</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">تاريخ التحويل</label>
          <input type="date" class="form-control" id="paymentDate" required />
        </div>
        <div class="mb-3">
          <label class="form-label">إثبات الدفع (صورة/PDF)</label>
          <div class="upload-zone" id="uploadZone">
            <input type="file" id="receiptFile" accept="image/*,application/pdf"
              style="display:none;" />
            <i class="fas fa-cloud-upload-alt fa-2x text-muted mb-2"></i>
            <p class="mb-0" id="uploadText">اضغط لاختيار ملف الإثبات</p>
            <small class="text-muted">صورة أو PDF، حد أقصى 5 ميجابايت</small>
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label">ملاحظات (اختياري)</label>
          <textarea class="form-control" id="notes" rows="2"
            placeholder="رقم العملية، اسم المرسل، أي تفاصيل..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" id="submitPaymentBtn">
          <i class="fas fa-paper-plane me-2"></i>إرسال إثبات الدفع
        </button>
        <button type="button" class="btn btn-outline-secondary" id="cancelPaymentBtn">إلغاء</button>
      </form>
    </div>

    <!-- زر رفع دفعة -->
    <div class="text-end mb-3" id="newPaymentBtnContainer">
      <button class="btn btn-primary" id="showNewPaymentBtn">
        <i class="fas fa-upload me-2"></i>رفع إثبات دفع
      </button>
    </div>

    <!-- سجل المدفوعات -->
    <h5 class="mb-3"><i class="fas fa-history"></i> سجل المدفوعات</h5>
    <div id="paymentsList">
      <p class="text-muted text-center py-3">جاري تحميل سجل المدفوعات...</p>
    </div>

  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
      }
    }
  </script>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/portal-payments.js"></script>

</body>
</html>
