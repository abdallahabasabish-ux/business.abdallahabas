<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مستحقات الموظفين — نظام إدارة الأعمال</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .stat-mini { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; text-align: center; }
    .stat-mini .num { font-size: 20px; font-weight: 700; }
    .stat-mini .lbl { font-size: 12px; color: var(--text-muted); }
    .ledger-type { padding: 3px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
    .lt-earning { background: rgba(40,167,69,0.15); color: #28a745; }
    .lt-bonus { background: rgba(23,162,184,0.15); color: #17a2b8; }
    .lt-deduction { background: rgba(220,53,69,0.15); color: #dc3545; }
    .lt-payout { background: rgba(13,110,253,0.15); color: #0d6efd; }
  </style>
</head>
<body>
  <div id="sidebar-overlay"></div>
  <aside id="sidebar"></aside>

  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">مستحقات الموظفين</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <section id="workspace">
      <!-- إحصائيات -->
      <div class="row g-3 mb-4">
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num text-success" id="statEarnings">$0</div><div class="lbl">أرباح معتمدة</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num text-info" id="statBonuses">$0</div><div class="lbl">مكافآت</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num text-danger" id="statDeductions">$0</div><div class="lbl">خصومات</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-mini"><div class="num text-primary" id="statPayouts">$0</div><div class="lbl">مدفوعات</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-mini"><div class="num text-warning" id="statPayable">$0</div><div class="lbl">صافي المستحق</div></div></div>
      </div>

      <!-- فلاتر -->
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2">
          <select class="form-select" id="employeeFilter" style="width:180px;"><option value="">كل الموظفين</option></select>
          <select class="form-select" id="typeFilter" style="width:140px;">
            <option value="">كل الأنواع</option>
            <option value="earning">أرباح</option>
            <option value="bonus">مكافآت</option>
            <option value="deduction">خصومات</option>
            <option value="payout">مدفوعات</option>
          </select>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-primary" id="processPayoutBtn">
            <i class="fas fa-hand-holding-usd me-1"></i>تسجيل دفعة
          </button>
          <button class="btn btn-primary" id="addEntryBtn">
            <i class="fas fa-plus me-2"></i>قيد جديد
          </button>
        </div>
      </div>

      <!-- جدول -->
      <div class="table-wrapper">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr><th>#</th><th>التاريخ</th><th>الموظف</th><th>النوع</th><th>المبلغ</th><th>السبب</th><th>الحالة</th><th>إجراءات</th></tr>
            </thead>
            <tbody id="ledgerTableBody">
              <tr><td colspan="8" class="text-center text-muted py-4">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- مودال -->
  <div class="modal fade" id="entryModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="entryModalTitle">قيد جديد</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="entryForm">
            <input type="hidden" id="entryId" />
            <div class="mb-3">
              <label class="form-label">الموظف *</label>
              <select class="form-select" id="entryEmployee" required></select>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">النوع *</label>
                <select class="form-select" id="entryType" required>
                  <option value="earning">ربح مهمة</option>
                  <option value="bonus">مكافأة</option>
                  <option value="deduction">خصم</option>
                  <option value="payout">دفعة مدفوعة</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">المبلغ *</label>
                <input type="number" class="form-control" id="entryAmount" step="0.01" min="0" required />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">السبب *</label>
              <input type="text" class="form-control" id="entryReason" required placeholder="سبب القيد..." />
            </div>
            <div class="mb-3">
              <label class="form-label">مهمة مرتبطة (اختياري)</label>
              <input type="text" class="form-control" id="entryTaskId" placeholder="معرّف المهمة" />
            </div>
            <div class="mb-3">
              <label class="form-label">طلب مرتبط (اختياري)</label>
              <input type="text" class="form-control" id="entryOrderId" placeholder="معرّف الطلب" />
            </div>
            <div class="mb-3">
              <label class="form-label">الحالة</label>
              <select class="form-select" id="entryStatus">
                <option value="approved">معتمد</option>
                <option value="pending">معلّق</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-primary" id="saveEntryBtn"><i class="fas fa-save me-2"></i>حفظ</button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
    } }
  </script>
  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/pages/employee-ledger.js"></script>
</body>
</html>
