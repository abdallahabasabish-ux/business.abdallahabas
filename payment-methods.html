<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طرق الدفع — نظام إدارة الأعمال</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div id="sidebar-overlay"></div>
  <aside id="sidebar"></aside>

  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">طرق الدفع</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <section id="workspace">
      <div class="alert alert-info">
        <i class="fas fa-info-circle me-2"></i>
        طرق الدفع هذه يراها العملاء في بوابة الدفع عند رفع إثباتات الدفع.
        لا تُرمّز بيانات الدفع في الشيفرة — تُهيّأ هنا.
      </div>

      <div class="d-flex justify-content-end mb-3">
        <button class="btn btn-primary" id="addMethodBtn">
          <i class="fas fa-plus me-2"></i>طريقة دفع جديدة
        </button>
      </div>

      <div class="table-wrapper">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr><th>#</th><th>الاسم</th><th>المستفيد</th><th>المعرّف</th><th>التعليمات</th><th>الحالة</th><th>إجراءات</th></tr>
            </thead>
            <tbody id="methodsTableBody">
              <tr><td colspan="7" class="text-center text-muted py-4">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <div class="modal fade" id="methodModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="methodModalTitle">طريقة دفع جديدة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="methodForm">
            <input type="hidden" id="methodId" />
            <div class="mb-3">
              <label class="form-label">اسم طريقة الدفع *</label>
              <input type="text" class="form-control" id="methodName" placeholder="مثال: تحويل بنكي، InstaPay، Vodafone Cash" required />
            </div>
            <div class="mb-3">
              <label class="form-label">المستفيد</label>
              <input type="text" class="form-control" id="methodHolder" placeholder="اسم صاحب الحساب" />
            </div>
            <div class="mb-3">
              <label class="form-label">رقم الحساب / المعرّف</label>
              <input type="text" class="form-control" id="methodIdentifier" placeholder="رقم الحساب أو رقم المحفظة" />
            </div>
            <div class="mb-3">
              <label class="form-label">التعليمات</label>
              <textarea class="form-control" id="methodInstructions" rows="3" placeholder="تعليمات التحويل للعميل..."></textarea>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="methodActive" checked>
              <label class="form-check-label" for="methodActive">نشطة (يظهر للعملاء)</label>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-primary" id="saveMethodBtn"><i class="fas fa-save me-2"></i>حفظ</button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
    } }
  </script>
  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/pages/payment-methods.js"></script>
</body>
</html>
