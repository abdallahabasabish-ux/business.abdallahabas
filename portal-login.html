<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة العميل — تسجيل الدخول</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .portal-card {
      max-width: 440px;
      margin: 40px auto;
      background: var(--bg-card);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 36px 32px;
      border: 1px solid var(--border-color);
    }
    .portal-brand {
      text-align: center;
      margin-bottom: 24px;
    }
    .portal-brand .logo-icon {
      width: 64px;
      height: 64px;
      border-radius: 18px;
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      font-weight: 800;
      margin-bottom: 12px;
    }
    .portal-brand h2 {
      color: var(--text-primary);
      font-weight: 700;
      margin: 0;
    }
    .portal-brand p {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }
    .portal-tabs .nav-link {
      color: var(--text-muted);
      font-weight: 600;
      border: none;
      border-bottom: 3px solid transparent;
      border-radius: 0;
    }
    .portal-tabs .nav-link.active {
      color: var(--color-primary);
      border-bottom-color: var(--color-primary);
      background: transparent;
    }
    .back-to-admin {
      position: fixed;
      top: 20px;
      left: 20px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-to-admin:hover { color: var(--color-primary); }
  </style>
</head>
<body class="login-page">

  <a href="../login.html" class="back-to-admin">
    <i class="fas fa-arrow-right me-1"></i>
    دخول الإدارة
  </a>

  <div class="portal-card">
    <div class="portal-brand">
      <div class="logo-icon">ن</div>
      <h2>بوابة العميل</h2>
      <p>تابع طلباتك ومدفوعاتك بنفسك</p>
    </div>

    <ul class="nav nav-tabs portal-tabs justify-content-center mb-4" id="portalTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="login-tab" data-bs-toggle="tab" data-bs-target="#loginPanel" type="button">تسجيل الدخول</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="register-tab" data-bs-toggle="tab" data-bs-target="#registerPanel" type="button">حساب جديد</button>
      </li>
    </ul>

    <div class="tab-content">
      <!-- ====== تسجيل الدخول ====== -->
      <div class="tab-pane fade show active" id="loginPanel" role="tabpanel">
        <form id="portalLoginForm">
          <div class="form-group mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="loginEmail" placeholder="example@email.com" required />
          </div>
          <div class="form-group mb-3">
            <label class="form-label">كلمة المرور</label>
            <div class="input-group">
              <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required />
              <button class="btn btn-outline-secondary" type="button" id="toggleLoginPassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <button type="submit" class="btn btn-primary w-100" id="loginBtn">
            <i class="fas fa-sign-in-alt me-2"></i>تسجيل الدخول
          </button>
          <div id="loginError" class="error-msg"></div>
        </form>
        <div class="text-center mt-3">
          <a href="#" id="forgotPasswordLink" style="color: var(--color-primary); font-size: 14px;">نسيت كلمة المرور؟</a>
        </div>
      </div>

      <!-- ====== إنشاء حساب ====== -->
      <div class="tab-pane fade" id="registerPanel" role="tabpanel">
        <form id="portalRegisterForm">
          <div class="form-group mb-3">
            <label class="form-label">الاسم الكامل</label>
            <input type="text" class="form-control" id="registerName" placeholder="الاسم كما تريد أن يظهر" required />
          </div>
          <div class="form-group mb-3">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="registerEmail" placeholder="example@email.com" required />
          </div>
          <div class="form-group mb-3">
            <label class="form-label">رقم الهاتف</label>
            <input type="tel" class="form-control" id="registerPhone" placeholder="01xxxxxxxxx" required />
          </div>
          <div class="form-group mb-3">
            <label class="form-label">كلمة المرور</label>
            <div class="input-group">
              <input type="password" class="form-control" id="registerPassword" placeholder="6 أحرف على الأقل" required minlength="6" />
              <button class="btn btn-outline-secondary" type="button" id="toggleRegisterPassword">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>
          <div class="form-group mb-3">
            <label class="form-label">تأكيد كلمة المرور</label>
            <input type="password" class="form-control" id="registerConfirm" placeholder="••••••••" required minlength="6" />
          </div>
          <button type="submit" class="btn btn-primary w-100" id="registerBtn">
            <i class="fas fa-user-plus me-2"></i>إنشاء الحساب
          </button>
          <div id="registerError" class="error-msg"></div>
        </form>
      </div>
    </div>

    <div class="text-center mt-3">
      <button class="icon-btn theme-toggle" id="themeToggle" title="تبديل الوضع المظلم">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
      }
    }
  </script>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/portal-auth.js"></script>

</body>
</html>
