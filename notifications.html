<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الإشعارات — نظام إدارة الأعمال</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .notif-item { background:var(--bg-card); border:1px solid var(--border-color); border-radius:10px; padding:14px 18px; margin-bottom:10px; transition:all 0.2s; cursor:pointer; }
    .notif-item:hover { border-color:var(--color-primary); }
    .notif-item.unread { border-right:4px solid var(--color-primary); background:rgba(255,102,0,0.04); }
    .notif-item .title { font-weight:700; font-size:14px; }
    .notif-item .body { color:var(--text-muted); font-size:13px; margin-top:4px; }
    .notif-item .time { font-size:11px; color:var(--text-muted); }
    .notif-icon { width:36px; height:36px; border-radius:10px; display:inline-flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; }
  </style>
</head>
<body>
  <div id="sidebar-overlay"></div>
  <aside id="sidebar"></aside>

  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">مركز الإشعارات</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <section id="workspace">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="d-flex gap-2">
          <button class="btn btn-sm btn-outline-primary" id="markAllReadBtn">
            <i class="fas fa-check-double me-1"></i>تعليم الكل كمقروء
          </button>
        </div>
        <div class="d-flex gap-2">
          <select class="form-select form-select-sm" id="typeFilter" style="width:160px;">
            <option value="">كل الأنواع</option>
            <option value="new_order">طلبات جديدة</option>
            <option value="order_approved">اعتماد طلبات</option>
            <option value="payment_pending">مدفوعات معلّقة</option>
            <option value="payment_approved">مدفوعات معتمدة</option>
            <option value="task_assigned">مهام مسندة</option>
            <option value="new_message">رسائل جديدة</option>
          </select>
          <select class="form-select form-select-sm" id="readFilter" style="width:120px;">
            <option value="">الكل</option>
            <option value="unread">غير مقروء</option>
            <option value="read">مقروء</option>
          </select>
        </div>
      </div>

      <div id="notifList">
        <p class="text-muted text-center py-5">جاري تحميل الإشعارات...</p>
      </div>
    </section>
  </div>

  <script type="importmap">
    { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
    } }
  </script>
  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/pages/notifications.js"></script>
</body>
</html>
