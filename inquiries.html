<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>الاستفسارات — نظام إدارة الأعمال</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .inq-status-badge { padding: 3px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
    .inq-new { background: rgba(13,110,253,0.15); color: #0d6efd; }
    .inq-contacted { background: rgba(23,162,184,0.15); color: #17a2b8; }
    .inq-interested { background: rgba(255,193,7,0.15); color: #ffc107; }
    .inq-quotation { background: rgba(108,117,125,0.15); color: #6c757d; }
    .inq-negotiation { background: rgba(255,102,0,0.15); color: #ff6600; }
    .inq-converted { background: rgba(40,167,69,0.15); color: #28a745; }
    .inq-rejected { background: rgba(220,53,69,0.15); color: #dc3545; }
    .inq-lost { background: rgba(220,53,69,0.15); color: #dc3545; }
    .stat-mini {
      background: var(--bg-card); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 14px; text-align: center;
    }
    .stat-mini .num { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .stat-mini .lbl { font-size: 12px; color: var(--text-muted); }
  </style>
</head>
<body>

  <div id="sidebar-overlay"></div>
  <aside id="sidebar"></aside>

  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">إدارة الاستفسارات</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <section id="workspace">

      <!-- إحصائيات -->
      <div class="row g-3 mb-4">
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num" id="statTotal">0</div><div class="lbl">إجمالي</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num" id="statNew">0</div><div class="lbl">جديدة</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num" id="statConverted">0</div><div class="lbl">محوّلة</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num" id="statLost">0</div><div class="lbl">مفقودة</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num" id="statConversionRate">0%</div><div class="lbl">معدل التحويل</div></div></div>
        <div class="col-md-2 col-6"><div class="stat-mini"><div class="num" id="statEstimatedValue">$0</div><div class="lbl">قيمة تقديرية</div></div></div>
      </div>

      <!-- فلاتر -->
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2 align-items-center">
          <input type="text" class="form-control" id="searchInput" placeholder="بحث..." style="width:200px;" />
          <select class="form-select" id="statusFilter" style="width:160px;">
            <option value="">كل الحالات</option>
            <option value="new">جديد</option>
            <option value="contacted">تم التواصل</option>
            <option value="interested">مهتم</option>
            <option value="quotation_sent">عرض سعر مرسل</option>
            <option value="negotiation">تفاوض</option>
            <option value="converted">محوّل</option>
            <option value="rejected">مرفوض</option>
            <option value="lost">مفقود</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addInquiryBtn">
          <i class="fas fa-plus me-2"></i>استفسار جديد
        </button>
      </div>

      <!-- جدول الاستفسارات -->
      <div class="table-wrapper">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>الاسم</th>
                <th>التواصل</th>
                <th>الخدمة</th>
                <th>المصدر</th>
                <th>القيمة التقديرية</th>
                <th>الحالة</th>
                <th>التاريخ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="inquiriesTableBody">
              <tr><td colspan="9" class="text-center text-muted py-4">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>

    </section>
  </div>

  <!-- مودال الاستفسار -->
  <div class="modal fade" id="inquiryModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="inquiryModalTitle">استفسار جديد</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="inquiryForm">
            <input type="hidden" id="inquiryId" />
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">اسم العميل *</label>
                <input type="text" class="form-control" id="inqCustomerName" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">رقم الهاتف *</label>
                <input type="tel" class="form-control" id="inqPhone" required />
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">البريد الإلكتروني</label>
                <input type="email" class="form-control" id="inqEmail" />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">المصدر</label>
                <select class="form-select" id="inqSource">
                  <option value="website">الموقع</option>
                  <option value="phone">هاتف</option>
                  <option value="email">بريد</option>
                  <option value="social">سوشيال ميديا</option>
                  <option value="referral">إحالة</option>
                  <option value="walk_in">زيارة</option>
                  <option value="other">أخرى</option>
                </select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">الخدمة المطلوبة</label>
                <select class="form-select" id="inqService">
                  <option value="">غير محدد</option>
                </select>
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">القيمة التقديرية</label>
                <input type="number" class="form-control" id="inqEstimatedValue" step="0.01" min="0" placeholder="0.00" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">ملاحظات</label>
              <textarea class="form-control" id="inqNotes" rows="3"></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">الحالة</label>
                <select class="form-select" id="inqStatus">
                  <option value="new">جديد</option>
                  <option value="contacted">تم التواصل</option>
                  <option value="interested">مهتم</option>
                  <option value="quotation_sent">عرض سعر مرسل</option>
                  <option value="negotiation">تفاوض</option>
                  <option value="converted">محوّل لطلب</option>
                  <option value="rejected">مرفوض</option>
                  <option value="lost">مفقود</option>
                </select>
              </div>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-primary" id="saveInquiryBtn">
            <i class="fas fa-save me-2"></i>حفظ
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
      }
    }
  </script>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/pages/inquiries.js"></script>

</body>
</html>
