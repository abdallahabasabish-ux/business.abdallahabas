<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>بوابة العميل — لوحة التحكم</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .portal-header {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff;
      padding: 20px 28px;
      border-radius: 14px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .portal-header h2 {
      margin: 0;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .portal-nav {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .portal-nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 18px;
      border-radius: 8px;
      background: rgba(255,255,255,0.15);
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
    }
    .portal-nav a:hover, .portal-nav a.active {
      background: rgba(255,255,255,0.3);
    }
    .portal-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 28px;
    }
    .portal-stat {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: all 0.25s;
    }
    .portal-stat:hover {
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
      border-color: var(--color-primary);
    }
    .portal-stat .icon {
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      margin-bottom: 8px;
    }
    .portal-stat .number {
      font-size: 26px;
      font-weight: 700;
      color: var(--text-primary);
    }
    .portal-stat .label {
      font-size: 13px;
      color: var(--text-muted);
      font-weight: 600;
    }
    .portal-section {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
    }
    .portal-section h5 {
      margin-bottom: 16px;
      color: var(--text-primary);
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .portal-section h5 i {
      color: var(--color-primary);
    }
    .order-status-badge {
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-new { background: rgba(13,110,253,0.15); color: #0d6efd; }
    .status-progress { background: rgba(255,193,7,0.15); color: #ffc107; }
    .status-complete { background: rgba(40,167,69,0.15); color: #28a745; }
    .status-cancelled { background: rgba(220,53,69,0.15); color: #dc3545; }
  </style>
</head>
<body>

  <div id="portalLoading" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="text-center">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">جاري التحميل...</span>
      </div>
      <p class="mt-3 text-muted">جاري التحقق من حسابك...</p>
    </div>
  </div>

  <div id="portalContent" style="display:none; max-width:1100px; margin:0 auto; padding:20px;">

    <!-- رأس البوابة -->
    <div class="portal-header">
      <h2><i class="fas fa-user-circle"></i> <span id="welcomeName">مرحباً</span></h2>
      <div class="portal-nav">
        <a href="portal-dashboard.html" class="active">لوحتي</a>
        <a href="portal-orders.html">طلباتي</a>
        <a href="portal-payments.html">مدفوعاتي</a>
        <a href="#" id="portalLogoutBtn"><i class="fas fa-sign-out-alt"></i></a>
      </div>
    </div>

    <!-- الإحصائيات -->
    <div class="portal-stats" id="portalStats">
      <div class="portal-stat">
        <div class="icon" style="background: rgba(13,110,253,0.12); color:#0d6efd;"><i class="fas fa-box"></i></div>
        <div class="number" id="statTotalOrders">0</div>
        <div class="label">إجمالي الطلبات</div>
      </div>
      <div class="portal-stat">
        <div class="icon" style="background: rgba(255,193,7,0.12); color:#ffc107;"><i class="fas fa-spinner"></i></div>
        <div class="number" id="statActiveOrders">0</div>
        <div class="label">طلبات جارية</div>
      </div>
      <div class="portal-stat">
        <div class="icon" style="background: rgba(40,167,69,0.12); color:#28a745;"><i class="fas fa-check-circle"></i></div>
        <div class="number" id="statCompletedOrders">0</div>
        <div class="label">طلبات مكتملة</div>
      </div>
      <div class="portal-stat">
        <div class="icon" style="background: rgba(220,53,69,0.12); color:#dc3545;"><i class="fas fa-clock"></i></div>
        <div class="number" id="statOutstanding">$0</div>
        <div class="label">مبالغ مستحقة</div>
      </div>
    </div>

    <!-- آخر الطلبات -->
    <div class="portal-section">
      <h5><i class="fas fa-box-open"></i> آخر طلباتي</h5>
      <div id="recentOrders">
        <p class="text-muted text-center py-3">جاري التحميل...</p>
      </div>
      <div class="text-center mt-3">
        <a href="portal-orders.html" class="btn btn-sm btn-accent">عرض كل الطلبات</a>
      </div>
    </div>

    <!-- المدفوعات المعلقة -->
    <div class="portal-section">
      <h5><i class="fas fa-file-invoice-dollar"></i> مدفوعات تنتظر منك</h5>
      <div id="pendingPayments">
        <p class="text-muted text-center py-3">جاري التحميل...</p>
      </div>
    </div>

    <!-- طلب خدمة جديد -->
    <div class="portal-section text-center">
      <h5><i class="fas fa-plus-circle"></i> بحاجة لخدمة جديدة؟</h5>
      <p class="text-muted mb-3">أرسل طلب خدمة وسيتواصل معك فريقنا</p>
      <button class="btn btn-primary" id="newServiceRequestBtn">
        <i class="fas fa-paper-plane me-2"></i>طلب خدمة جديدة
      </button>
    </div>

  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
      }
    }
  </script>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/portal-dashboard.js"></script>

</body>
</html>
