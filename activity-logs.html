<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>سجل النشاطات — نظام إدارة الأعمال</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .log-action-badge { padding:3px 10px; border-radius:15px; font-size:11px; font-weight:600; }
    .la-create { background:rgba(40,167,69,0.15); color:#28a745; }
    .la-update { background:rgba(13,110,253,0.15); color:#0d6efd; }
    .la-delete { background:rgba(220,53,69,0.15); color:#dc3545; }
    .la-approve { background:rgba(40,167,69,0.15); color:#28a745; }
    .la-reject { background:rgba(220,53,69,0.15); color:#dc3545; }
    .la-login { background:rgba(108,117,125,0.15); color:#6c757d; }
    .la-other { background:rgba(255,193,7,0.15); color:#ffc107; }
  </style>
</head>
<body>
  <div id="sidebar-overlay"></div>
  <aside id="sidebar"></aside>

  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">سجل النشاطات</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <section id="workspace">
      <div class="alert alert-info">
        <i class="fas fa-shield-alt me-2"></i>
        هذا السجل <strong>append-only</strong>: لا يمكن تعديله أو حذفه (مُطبَّق في قواعد Firestore).
        يوفّر تتبعًا موثوقًا لكل العمليات الحساسة.
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="searchInput" placeholder="بحث..." style="width:200px;" />
          <select class="form-select" id="actionFilter" style="width:180px;">
            <option value="">كل الإجراءات</option>
          </select>
          <select class="form-select" id="userFilter" style="width:180px;">
            <option value="">كل المستخدمين</option>
          </select>
        </div>
        <button class="btn btn-outline-success" id="exportLogsBtn">
          <i class="fas fa-file-excel me-1"></i>تصدير Excel
        </button>
      </div>

      <div class="table-wrapper">
        <div class="table-responsive">
          <table class="table table-hover" id="logsTable">
            <thead>
              <tr>
                <th>التاريخ</th>
                <th>المستخدم</th>
                <th>الدور</th>
                <th>الإجراء</th>
                <th>السجل المرتبط</th>
                <th>الملخص</th>
              </tr>
            </thead>
            <tbody id="logsTableBody">
              <tr><td colspan="6" class="text-center text-muted py-4">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <script type="importmap">
    { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
    } }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/pages/activity-logs.js"></script>
</body>
</html>
