<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المصروفات — نظام إدارة الأعمال</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr@4.6.13/dist/flatpickr.min.css" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    .stat-mini { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 14px; text-align: center; }
    .stat-mini .num { font-size: 22px; font-weight: 700; color: var(--text-primary); }
    .stat-mini .lbl { font-size: 12px; color: var(--text-muted); }
    .cat-badge { padding: 3px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="sidebar-overlay"></div>
  <aside id="sidebar"></aside>

  <div id="main-content">
    <header id="topbar">
      <div class="topbar-left">
        <button class="hamburger" id="sidebarToggle"><i class="fas fa-bars"></i></button>
        <h1 class="page-title">إدارة المصروفات</h1>
      </div>
      <div class="topbar-right">
        <button class="icon-btn theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
        <button class="icon-btn" id="logoutBtn"><i class="fas fa-sign-out-alt"></i></button>
      </div>
    </header>

    <section id="workspace">
      <!-- إحصائيات -->
      <div class="row g-3 mb-4">
        <div class="col-md-3 col-6"><div class="stat-mini"><div class="num" id="statTotal">$0</div><div class="lbl">إجمالي المصروفات</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-mini"><div class="num" id="statThisMonth">$0</div><div class="lbl">هذا الشهر</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-mini"><div class="num" id="statCount">0</div><div class="lbl">عدد المصروفات</div></div></div>
        <div class="col-md-3 col-6"><div class="stat-mini"><div class="num" id="statAvg">$0</div><div class="lbl">متوسط المصروف</div></div></div>
      </div>

      <!-- فلاتر -->
      <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
        <div class="d-flex gap-2 align-items-center">
          <input type="text" class="form-control" id="searchInput" placeholder="بحث..." style="width:200px;" />
          <select class="form-select" id="categoryFilter" style="width:160px;">
            <option value="">كل الفئات</option>
          </select>
        </div>
        <button class="btn btn-primary" id="addExpenseBtn">
          <i class="fas fa-plus me-2"></i>مصروف جديد
        </button>
      </div>

      <!-- جدول -->
      <div class="table-wrapper">
        <div class="table-responsive">
          <table class="table table-hover">
            <thead>
              <tr>
                <th>#</th>
                <th>التاريخ</th>
                <th>الوصف</th>
                <th>الفئة</th>
                <th>المبلغ</th>
                <th>طريقة الدفع</th>
                <th>طلب مرتبط</th>
                <th>ملاحظات</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="expensesTableBody">
              <tr><td colspan="9" class="text-center text-muted py-4">جاري التحميل...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <!-- مودال -->
  <div class="modal fade" id="expenseModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="expenseModalTitle">مصروف جديد</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="expenseForm">
            <input type="hidden" id="expenseId" />
            <div class="mb-3">
              <label class="form-label">الوصف *</label>
              <input type="text" class="form-control" id="expDescription" required />
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">المبلغ *</label>
                <input type="number" class="form-control" id="expAmount" step="0.01" min="0" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">الفئة *</label>
                <select class="form-select" id="expCategory" required></select>
              </div>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">التاريخ *</label>
                <input type="date" class="form-control" id="expDate" required />
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">طريقة الدفع</label>
                <select class="form-select" id="expPaymentMethod">
                  <option value="cash">كاش</option>
                  <option value="bank">تحويل بنكي</option>
                  <option value="card">بطاقة</option>
                  <option value="online">إلكتروني</option>
                  <option value="other">أخرى</option>
                </select>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">طلب مرتبط (اختياري)</label>
              <select class="form-select" id="expOrder">
                <option value="">بدون طلب</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label">ملاحظات</label>
              <textarea class="form-control" id="expNotes" rows="2"></textarea>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إلغاء</button>
          <button type="button" class="btn btn-primary" id="saveExpenseBtn">
            <i class="fas fa-save me-2"></i>حفظ
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
      "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
      "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
    } }
  </script>
  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/pages/expenses.js"></script>
</body>
</html>
