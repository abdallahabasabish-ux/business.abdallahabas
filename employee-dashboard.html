<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الموظف — نظام إدارة الأعمال</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.rtl.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="assets/css/style.css" />

  <style>
    .emp-header {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      color: #fff; padding: 22px 28px; border-radius: 14px; margin-bottom: 24px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px;
    }
    .emp-header h2 { margin: 0; font-weight: 700; display: flex; align-items: center; gap: 12px; }
    .emp-header .role-badge {
      background: rgba(255,255,255,0.2); padding: 4px 14px; border-radius: 20px; font-size: 13px;
    }
    .emp-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 14px; margin-bottom: 28px; }
    .emp-stat {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 18px; text-align: center; transition: all 0.25s;
    }
    .emp-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-md); border-color: var(--color-primary); }
    .emp-stat .icon { width: 44px; height: 44px; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; font-size: 20px; margin-bottom: 6px; }
    .emp-stat .number { font-size: 24px; font-weight: 700; color: var(--text-primary); }
    .emp-stat .label { font-size: 12px; color: var(--text-muted); font-weight: 600; }
    .emp-section {
      background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 12px;
      padding: 20px; margin-bottom: 24px;
    }
    .emp-section h5 { margin-bottom: 16px; color: var(--text-primary); font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .emp-section h5 i { color: var(--color-primary); }
    .task-card {
      border: 1px solid var(--border-color); border-radius: 10px; padding: 16px; margin-bottom: 12px;
      transition: all 0.2s;
    }
    .task-card:hover { border-color: var(--color-primary); box-shadow: var(--shadow-sm); }
    .task-card.overdue { border-color: #dc3545; background: rgba(220,53,69,0.04); }
    .task-status-badge { padding: 3px 10px; border-radius: 15px; font-size: 11px; font-weight: 600; }
    .ts-new { background: rgba(13,110,253,0.15); color: #0d6efd; }
    .ts-assigned { background: rgba(108,117,125,0.15); color: #6c757d; }
    .ts-progress { background: rgba(255,193,7,0.15); color: #ffc107; }
    .ts-review { background: rgba(23,162,184,0.15); color: #17a2b8; }
    .ts-completed { background: rgba(40,167,69,0.15); color: #28a745; }
    .ts-rejected { background: rgba(220,53,69,0.15); color: #dc3545; }
    .ts-overdue { background: rgba(220,53,69,0.25); color: #dc3545; font-weight: 700; }
    .priority-high { color: #dc3545; font-weight: 700; }
    .priority-medium { color: #ffc107; }
    .priority-low { color: #28a745; }
  </style>
</head>
<body>

  <div id="empLoading" style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <div class="text-center">
      <div class="spinner-border text-primary"></div>
      <p class="mt-3 text-muted">جاري التحقق من حسابك...</p>
    </div>
  </div>

  <div id="empContent" style="display:none; max-width:1100px; margin:0 auto; padding:20px;">

    <div class="emp-header">
      <h2><i class="fas fa-user-cog"></i> <span id="empWelcome">مرحباً</span></h2>
      <div>
        <span class="role-badge" id="empRole">موظف</span>
        <button class="btn btn-sm btn-outline-light ms-2" id="empLogoutBtn">
          <i class="fas fa-sign-out-alt"></i> خروج
        </button>
      </div>
    </div>

    <!-- الإحصائيات -->
    <div class="emp-stats">
      <div class="emp-stat">
        <div class="icon" style="background: rgba(13,110,253,0.12); color:#0d6efd;"><i class="fas fa-tasks"></i></div>
        <div class="number" id="statTotalTasks">0</div>
        <div class="label">إجمالي مهامي</div>
      </div>
      <div class="emp-stat">
        <div class="icon" style="background: rgba(255,193,7,0.12); color:#ffc107;"><i class="fas fa-spinner"></i></div>
        <div class="number" id="statInProgress">0</div>
        <div class="label">قيد التنفيذ</div>
      </div>
      <div class="emp-stat">
        <div class="icon" style="background: rgba(40,167,69,0.12); color:#28a745;"><i class="fas fa-check-circle"></i></div>
        <div class="number" id="statCompleted">0</div>
        <div class="label">مكتملة</div>
      </div>
      <div class="emp-stat">
        <div class="icon" style="background: rgba(220,53,69,0.12); color:#dc3545;"><i class="fas fa-exclamation-triangle"></i></div>
        <div class="number" id="statOverdue">0</div>
        <div class="label">متأخرة</div>
      </div>
      <div class="emp-stat">
        <div class="icon" style="background: rgba(255,102,0,0.12); color:#ff6600;"><i class="fas fa-dollar-sign"></i></div>
        <div class="number" id="statEarnings">$0</div>
        <div class="label">مستحقاتي</div>
      </div>
    </div>

    <!-- المهام الحالية -->
    <div class="emp-section">
      <h5><i class="fas fa-list-check"></i> مهامي الحالية</h5>
      <div id="myTasksList">
        <p class="text-muted text-center py-3">جاري تحميل مهامك...</p>
      </div>
    </div>

    <!-- المواعيد القادمة -->
    <div class="emp-section">
      <h5><i class="fas fa-calendar-alt"></i> مواعيد التسليم القادمة</h5>
      <div id="upcomingDeadlines">
        <p class="text-muted text-center py-3">جاري التحميل...</p>
      </div>
    </div>

    <!-- المستحقات -->
    <div class="emp-section">
      <h5><i class="fas fa-wallet"></i> مستحقاتي المالية</h5>
      <div id="earningsSummary">
        <p class="text-muted text-center py-3">جاري التحميل...</p>
      </div>
    </div>

  </div>

  <!-- مودال تفاصيل المهمة -->
  <div class="modal fade" id="taskDetailModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="taskDetailTitle">تفاصيل المهمة</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body" id="taskDetailBody"></div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">إغلاق</button>
        </div>
      </div>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/storage": "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js"
      }
    }
  </script>

  <script type="module" src="assets/js/firebase-config.js"></script>
  <script type="module" src="assets/js/employee-dashboard.js"></script>

</body>
</html>
